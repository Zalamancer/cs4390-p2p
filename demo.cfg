# Settings for start_demo.sh. Every timing and port used by the demo is here.

TRACKER_IP=127.0.0.1
TRACKER_PORT=3490
PEER_BASE_PORT=5000        # peer N listens on PEER_BASE_PORT + N
UPDATE_INTERVAL_SEC=15     # how often each peer refreshes the tracker
DEAD_PEER_SEC=40           # tracker drops a peer silent for this long

SMALL_FILE=small.bin
SMALL_FILE_BYTES=1048576   # 1 MB, shared by peer 1
LARGE_FILE=large.bin
LARGE_FILE_BYTES=20971520  # 20 MB, shared by peer 2

THREADS=4                  # download threads per file
SEGMENT_BYTES=262144       # 256 KB
CHUNK_DELAY_MS=20          # pause per 1024-byte chunk, so that the large file
                           # takes at least 1 min 20 s even on one machine
RETRY_SEC=3                # how often to re-check when no peer has a segment
BAD_PEER_SEC=30            # how long to avoid a peer after a failed connection

SECOND_WAVE_SEC=30         # peers 3 to 8 start
THIRD_WAVE_SEC=90          # peers 9 to 13 start, peers 1 and 2 stop
FINISH_TIMEOUT_SEC=420     # stop waiting for downloads after this long
